name: Deploy docs

# Sitio 100 % estático publicado en GitHub Pages. No usa secretos ni variables
# de entorno propias: si en algún momento hicieran falta, es señal de que se
# está metiendo en la documentación algo que no debería ser público.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + comprobaciones. Corre también en pull requests, donde no despliega:
  # así un enlace roto o un fallo de build se ven antes de llegar a main.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm fijado a la 10: la 11.6.2 escribe un package-lock.json que su propio
      # `npm ci` rechaza (se deja fuera las entradas anidadas de @emnapi/* que
      # arrastra el satteri-wasm32-wasi de Astro). Fijarlo aquí evita que una
      # actualización de la imagen del runner vuelva a romper el install.
      - name: Pin npm
        run: npm i -g npm@10

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Comprobar enlaces internos
        run: node scripts/check-links.mjs

      - name: Comprobar que no se publican datos internos
        run: node scripts/check-public-safe.mjs

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
